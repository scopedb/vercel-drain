name: vercel_events
comment: Vercel Drain logs, HTTP requests, Web Analytics pageviews/events, Speed Insights vitals, and application events
columns:
  - name: event_id
    data_type: string
    comment: Unique row identifier
  - name: occurred_at
    data_type: timestamp
    comment: Event timestamp in UTC
  - name: service
    data_type: string
    comment: Vercel project name, project ID, or service identifier
  - name: event_type
    data_type: string
    comment: vercel.request, vercel.log, vercel.pageview, vercel.custom_event, or vercel.web_vital
  - name: outcome
    data_type: string
    comment: Execution or HTTP outcome (ok, client_error, error)
  - name: level
    data_type: string
    comment: Normalized severity (debug, info, warn, error)
  - name: method
    data_type: string
    comment: HTTP request method when applicable
  - name: host
    data_type: string
    comment: Request or deployment URL hostname
  - name: path
    data_type: string
    comment: Request URL pathname without query parameters
  - name: status
    data_type: int
    comment: HTTP response status code
  - name: request_id
    data_type: string
    comment: Vercel request ID (x-vercel-id) or drain record ID
  - name: message
    data_type: string
    comment: Human-readable request summary, runtime log line, custom event name, or Web Vital summary
  - name: attributes
    data_type: object
    comment: Structured Vercel deployment, edge cache, geography, attribution, trace, or Web Vital metadata
cluster_by:
  - service
  - occurred_at
