name: v_vercel_ai_bots
comment: AI user-agent requests and Markdown/llms.txt content access, with separate identity and content signals
statement: |
  FROM scopedb.public.vercel_events
  WHERE event_type = 'vercel.request'
  SELECT
      occurred_at,
      service,
      outcome,
      method,
      host,
      path,
      status,
      request_id,
      attributes['environment']::string AS environment,
      attributes['region']::string AS region,
      attributes['vercel_cache']::string AS vercel_cache,
      attributes['user_agent']::string AS user_agent,
      attributes['referer_host']::string AS referer_host
  SELECT *,
      if(regexp_like(
          user_agent,
          regex => '(?i)(ClaudeBot|Claude-Web|Claude-User|Anthropic|GPTBot|ChatGPT-User|OAI-SearchBot|Codex|Cursor|PerplexityBot|Perplexity-User|CCBot|Google-Extended|Applebot-Extended|Bytespider|Amazonbot|cohere-ai|YouBot)'
      ), true, false) AS is_ai_user_agent,
      if(path = '/llms.txt' OR ends_with(path, '.md'), true, false) AS is_markdown_request
  WHERE is_ai_user_agent OR is_markdown_request
