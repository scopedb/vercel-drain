name: v_vercel_errors
comment: Vercel 5xx HTTP responses, runtime error logs, and failed outcomes
statement: |
  FROM scopedb.public.vercel_events
  WHERE level = 'error'
     OR outcome = 'error'
     OR (status IS NOT NULL AND status >= 500)
  SELECT
      occurred_at,
      service,
      event_type,
      outcome,
      level,
      method,
      host,
      path,
      status,
      request_id,
      message,
      attributes['deployment_id']::string AS deployment_id,
      attributes['environment']::string AS environment,
      attributes['source']::string AS source,
      attributes['trace_id']::string AS trace_id,
      attributes['span_id']::string AS span_id,
      attributes
